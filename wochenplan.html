<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wochenplan – Daniel Schieler Gartengestaltung</title><style>
:root{--bg:#F0F2F0;--bg2:#FFFFFF;--bg3:#F5F5F5;--border:#DFDFDF;--navy:#003952;--navy-d:#00283A;--navy-bg:#EAF1F4;--navy-bg2:#D3E3E9;--lime:#BACB02;--lime-d:#7A8601;--lime-bg:#F7FAD6;--amber:#C17A00;--amber-bg:#FFF3DC;--red:#A43C37;--red-bg:#FBEAE9;--text:#1A1A1A;--text2:#3A3A3A;--text3:#5A6B75;--font:'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding-bottom:30px}
.header{background:#fff;border-bottom:3px solid var(--navy);padding:16px 18px}
.header h1{font-size:18px;color:var(--navy-d);font-weight:700}
.header .sub{font-size:12px;color:var(--text3);margin-top:2px}
.wrap{max-width:600px;margin:0 auto;padding:14px}
.notiz{padding:10px 14px;border-radius:9px;font-size:14px;font-weight:600;margin-bottom:8px}
.day{background:#fff;border:1.5px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.day-head{background:var(--navy);color:#fff;padding:10px 14px;font-size:15px;font-weight:700}
.day-info{padding:8px 14px;font-size:13px;font-weight:600}
.team{padding:12px 14px;border-top:1px solid var(--border)}
.team-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.team-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.team-crew{font-size:11px;color:var(--text3);font-weight:500}
.team-site{font-size:12px;color:var(--navy-d);font-weight:600;margin:4px 0}
.team-tasks{font-size:13px;color:var(--text2);line-height:1.5;margin-left:2px}
.team-tasks div{margin-bottom:2px}
.team-tag{display:inline-block;margin-top:5px;font-size:11px;padding:2px 8px;border-radius:12px;background:var(--amber-bg);color:var(--amber);font-weight:700}
.team-machines{display:inline-block;margin-top:5px;margin-left:5px;font-size:11px;padding:2px 8px;border-radius:12px;background:var(--lime-bg);color:var(--lime-d);font-weight:700}
.team-empty{color:var(--text3);font-style:italic}
.no-day{padding:14px;font-size:13px;color:var(--text3)}
.footer{max-width:600px;margin:0 auto;padding:10px 14px;font-size:11px;color:var(--text3);text-align:center}
</style></head><body>
<div class="header">
  <h1>Daniel Schieler Gartengestaltung</h1>
  <div class="sub">Wochenplan · <span id="kw-label">KW –</span></div>
</div>
<div class="wrap" id="notizen-wrap"></div>
<div class="wrap" id="days-wrap"></div>
<div class="footer" id="footer-stand">Stand: –</div>
<script>
const EXCEL={"T1_Aufgeloest_Mo":3,"T2_Crew_Mo":"RK","T2_Baustelle_Mo":"BVH Kricke, Allmendstraße 19, Hemmingen","T2_Aufgabe_Mo":"Terrasse Schottern, Stellplatz Pflastern","T3_Crew_Mo":"DZ DS","T3_Baustelle_Mo":"Jens Lutz, Clara-Zetkin Str.34 Wiernsheim","T3_Aufgabe_Mo":"Baggerdienstleistung","T3_Material_Mo":"Ich komme zum Tanken","T4_Crew_Mo":"VB CT","T4_Baustelle_Mo":"BVH: Deufel/Kappes Steinestraße 17/1, Enzweihingen","T4_Aufgabe_Mo":"Mauerscheiben Setzen","T4_Material_Mo":"Je nach Bedarf kann ich Beton liefern","T1_Crew_Di":"DS","T1_Baustelle_Di":"Klärwerk Thalhausen","T2_Crew_Di":"RK","T2_Baustelle_Di":"BVH Kricke, Allmendstraße 19, Hemmingen","T2_Aufgabe_Di":"Rest Pflasterarbeiten; Erdarbeiten,","T2_Material_Di":"Schotter nach bedarf bestellen","T3_Crew_Di":"DZ","T3_Baustelle_Di":"Klärwerk Thalhausen","T3_Aufgabe_Di":"Baggerdienstleistung","T4_Crew_Di":"VB CT","T4_Baustelle_Di":"BVH: Deufel/Kappes Steinestraße 17/1, Enzweihingen","T4_Aufgabe_Di":"Stufen setzen, Paralell Mauerscheiben","T1_Crew_Mi":"DS","T1_Baustelle_Mi":"Klärwerk Thalhausen","T2_Crew_Mi":"RK PS","T2_Baustelle_Mi":"BVH Kricke, Allmendstraße 19, Hemmingen","T2_Aufgabe_Mi":"Rest Erdarbeiten, Terrasse Splitten, Substrat","T2_Material_Mi":"Substrat kann ich nach bedarf liefern","T3_Crew_Mi":"DZ","T3_Baustelle_Mi":"Klärwerk Thalhausen","T3_Aufgabe_Mi":"Baggerdienstleistung","T4_Crew_Mi":"VB CT","T4_Baustelle_Mi":"BVH: Deufel/Kappes Steinestraße 17/1, Enzweihingen","T4_Aufgabe_Mi":"Stufen versetzen; Mauerscheiben Setzen","T1_Crew_Do":"DS","T1_Baustelle_Do":"DANIEL SCHIELER GALABAU","T2_Crew_Do":"RK PS","T2_Baustelle_Do":"BVH Kricke, Allmendstraße 19, Hemmingen","T2_Aufgabe_Do":"Felsen in Böschung setzen, Restarbeioten, baustelle abräumen","T3_Crew_Do":"DZ","T3_Baustelle_Do":"Klärwerk Thalhausen","T3_Aufgabe_Do":"Baggerdienstleistung","T4_Crew_Do":"VB CT","T4_Baustelle_Do":"BVH: Deufel/Kappes Steinestraße 17/1, Enzweihingen","T4_Aufgabe_Do":"Rest Mauerscheiben setzen; Rest stufen setzen","T1_Crew_Fr":"DS","T1_Baustelle_Fr":"DANIEL SCHIELER GALABAU","T2_Crew_Fr":"RK PS","T2_Baustelle_Fr":"Kinzinger Hochdorf","T2_Aufgabe_Fr":"Baustelle einrichten, Hecke Roden, Mauer abbrechen","T3_Crew_Fr":"DZ","T3_Baustelle_Fr":"Klärwerk Thalhausen","T3_Aufgabe_Fr":"Baggerdienstleistung","T4_Crew_Fr":"VB CT","T4_Baustelle_Fr":"BVH: Deufel/Kappes Steinestraße 17/1, Enzweihingen","T4_Aufgabe_Fr":"Terrasse fertig; Mauer fertig","T2_Maschinen_Mo":"Bagger 4to, Mobilbagger, Radlader 4to","T3_Maschinen_Di":"Mobilbagger","T4_Maschinen_Di":"Bagger 8to, Radlader 6to","T2_Maschinen_Mi":"Bagger 4to, Radlader 4to","T3_Maschinen_Mi":"Mobilbagger","T4_Maschinen_Mi":"Bagger 8to, Radlader 6to","T2_Maschinen_Do":"Bagger 4to, Radlader 4to","T3_Maschinen_Do":"Mobilbagger","T4_Maschinen_Do":"Bagger 8to, Radlader 6to","T2_Maschinen_Fr":"Bagger 4to, Radlader 4to","T3_Maschinen_Fr":"Mobilbagger","T4_Maschinen_Fr":"Bagger 8to, Radlader 6to","_Woche":"2026-10-12"};
const NOTIZEN=[{"text":"Für Donnerstag ist Starker Niederschlag vorher gesagt, Bei der Planung bedenken","level":"info"},{"text":"Ab dem 13.010 bin ich Dienstags Mittags nicht mehr greifbar. Kinderdienst weil Frau wieder Arbeitet","level":"urgent"}];
const DAYS=[{k:'Mo',label:'Montag'},{k:'Di',label:'Dienstag'},{k:'Mi',label:'Mittwoch'},{k:'Do',label:'Donnerstag'},{k:'Fr',label:'Freitag'}];
const TEAM_CFG=[{n:1,bg:'#6B7280'},{n:2,bg:'#003952'},{n:3,bg:'#4338CA'},{n:4,bg:'#B45309'}];

function computeKW(){const n=new Date();const dt=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7));const y=new Date(Date.UTC(dt.getUTCFullYear(),0,1));return Math.ceil((((dt-y)/86400000)+1)/7)}

function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function kwOf(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil((((t-y)/86400000)+1)/7)}
function dm(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'}

// Der Editor speichert in EXCEL._Woche den Montag (ISO) der Woche, zu der der Plan gehoert.
function planWocheLabel(){
  const pw=EXCEL._Woche;
  if(!pw)return 'KW '+computeKW();
  const mo=new Date(pw+'T12:00:00');const fr=new Date(mo);fr.setDate(fr.getDate()+4);
  return 'KW '+kwOf(mo)+' ('+dm(mo)+'–'+dm(fr)+fr.getFullYear()+')';
}
function planVeraltet(){
  const pw=EXCEL._Woche;if(!pw)return false;
  const dow=new Date().getDay();if(dow===0||dow===6)return false;
  return pw<isoLocal(mondayOf(new Date()));
}

function renderNotizen(){
  const wrap=document.getElementById('notizen-wrap');
  const heute=isoLocal(new Date());
  const aktuelle=(NOTIZEN||[]).filter(n=>!n.bis||n.bis>=heute); // abgelaufene Notizen ausblenden
  let html='';
  if(planVeraltet())html+='<div class="notiz" style="background:var(--red-bg);color:var(--red)">⚠ Dieser Plan ist veraltet: '+planWocheLabel()+' – die neue Woche ist noch nicht geplant.</div>';
  if(!aktuelle.length){wrap.innerHTML=html;return}
  aktuelle.forEach(n=>{
    const c=n.level==='urgent'?{bg:'var(--red-bg)',fg:'var(--red)'}:n.level==='info'?{bg:'var(--navy-bg)',fg:'var(--navy-d)'}:{bg:'var(--amber-bg)',fg:'var(--amber)'};
    html+='<div class="notiz" style="background:'+c.bg+';color:'+c.fg+'">📌 '+n.text+'</div>';
  });
  wrap.innerHTML=html;
}

function renderDays(){
  let html='';
  DAYS.forEach(d=>{
    const infoRaw=EXCEL['Wichtige_Infos_'+d.k];
    const info=infoRaw?(typeof infoRaw==='object'?infoRaw.text:infoRaw):'';
    const level=infoRaw&&typeof infoRaw==='object'?(infoRaw.level||'warn'):'warn';
    const infoColor=level==='urgent'?{bg:'var(--red-bg)',fg:'var(--red)'}:level==='info'?{bg:'var(--navy-bg)',fg:'var(--navy-d)'}:{bg:'var(--amber-bg)',fg:'var(--amber)'};

    let teamsHtml='';
    TEAM_CFG.forEach(tc=>{
      if(EXCEL['T'+tc.n+'_Aufgeloest_'+d.k])return; // Vorarbeiter ist bei einem anderen Team eingeplant -> Team entfaellt
      const crew=EXCEL['T'+tc.n+'_Crew_'+d.k]||'';
      const auf=EXCEL['T'+tc.n+'_Aufgabe_'+d.k]||'';
      const bs=EXCEL['T'+tc.n+'_Baustelle_'+d.k]||'';
      const sh=EXCEL['T'+tc.n+'_Sonder_'+d.k]||'';
      const ma=EXCEL['T'+tc.n+'_Maschinen_'+d.k]||'';
      const aufgaben=auf.split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
      const tasksHtml=aufgaben.length?aufgaben.map(a=>'<div>• '+a+'</div>').join(''):'<div class="team-empty">Keine Einträge</div>';
      teamsHtml+='<div class="team"><div class="team-name"><span class="team-dot" style="background:'+tc.bg+'"></span>Team '+tc.n+(crew?' <span class="team-crew">· '+crew+'</span>':'')+'</div>'+(bs?'<div class="team-site">📍 '+bs+'</div>':'')+'<div class="team-tasks">'+tasksHtml+'</div>'+(sh?'<div class="team-tag">⚠ '+sh+'</div>':'')+(ma?'<div class="team-machines">🛠 '+ma+'</div>':'')+'</div>';
    });

    html+='<div class="day"><div class="day-head">'+d.label+'</div>'+(info?'<div class="day-info" style="background:'+infoColor.bg+';color:'+infoColor.fg+'">⚠ '+info+'</div>':'')+teamsHtml+'</div>';
  });
  document.getElementById('days-wrap').innerHTML=html;
}

document.getElementById('kw-label').textContent=planWocheLabel();
renderNotizen();
renderDays();
const now=new Date();
document.getElementById('footer-stand').textContent='Stand: '+String(now.getDate()).padStart(2,'0')+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+now.getFullYear()+', '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' Uhr · automatisch aktualisiert';
</script>
</body></html>
